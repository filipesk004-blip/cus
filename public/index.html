<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Witch It 3D - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050811; font-family: 'Segoe UI', sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #f59e0b; }
        #crosshair::before { top: 5px; left: -10px; width: 32px; height: 2px; }
        #crosshair::after { top: -10px; left: 5px; width: 2px; height: 32px; }
    </style>
</head>
<body class="select-none" oncontextmenu="return false;">

    <div id="crosshair"></div>

    <div class="fixed top-4 left-4 z-10 text-white bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-xl">
        <h1 class="text-amber-400 font-black text-base uppercase tracking-wider">Witch It - Vesnice</h1>
        <div class="text-xs text-slate-300 mt-2 space-y-1">
            <div>Tvoje role: <span id="role-display" class="font-bold text-purple-400">Připojování...</span></div>
            <div>Pohyb: <span class="text-amber-400 font-bold">WASD</span> | Běh: <span class="text-amber-400 font-bold">Shift</span></div>
            <div>[Čarodějnice] Proměna: namiř na objekt + <span class="text-amber-400 font-bold">E</span></div>
            <div>[Hunter] Střelba kouzlem: <span class="text-amber-400 font-bold">LMB</span></div>
        </div>
    </div>

    <div id="game-container" class="w-full h-screen"></div>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let yawObject, pitchObject;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let prevTime = performance.now();
        let isLocked = false;

        let myId = null;
        let myRole = 'witch';
        let otherPlayers = {};
        let mapObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            pitchObject = new THREE.Object3D();
            pitchObject.add(camera);

            yawObject = new THREE.Object3D();
            yawObject.position.set(0, 1.6, 0);
            yawObject.add(pitchObject);
            scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xfde047, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            buildMap();
            setupSocket();

            document.body.addEventListener('click', () => {
                if (!isLocked) document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousedown', onMouseDown);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createPropMesh(type) {
            let group = new THREE.Group();
            let mesh;

            if (type === 'box') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 }));
                mesh.position.y = 0.5;
            } else if (type === 'barrel') {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.2, 12), new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.5 }));
                mesh.position.y = 0.6;
            } else if (type === 'rock') {
                mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 }));
                mesh.position.y = 0.5;
            } else if (type === 'pumpkin') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 10), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 }));
                mesh.scale.set(1, 0.8, 1);
                mesh.position.y = 0.4;
            } else if (type === 'haybale') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.9), new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.9 }));
                mesh.position.y = 0.4;
            } else {
                mesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
                mesh.position.y = 0.9;
            }

            group.add(mesh);
            group.userData = { type: type };
            return group;
        }

        function buildMap() {
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x141b2d, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            for (let i = 0; i < 4; i++) {
                const house = new THREE.Group();
                const wall = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 8), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                wall.position.y = 3;
                const roof = new THREE.Mesh(new THREE.ConeGeometry(7, 4, 4), new THREE.MeshStandardMaterial({ color: 0x7f1d1d }));
                roof.position.y = 8; roof.rotation.y = Math.PI / 4;

                house.add(wall, roof);
                const angle = (i * Math.PI) / 2;
                house.position.set(Math.cos(angle) * 22, 0, Math.sin(angle) * 22);
                scene.add(house);
            }

            const types = ['box', 'barrel', 'rock', 'pumpkin', 'haybale'];
            for (let i = 0; i < 80; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const prop = createPropMesh(type);
                const x = (Math.random() - 0.5) * 70;
                const z = (Math.random() - 0.5) * 70;
                prop.position.set(x, 0, z);
                prop.rotation.y = Math.random() * Math.PI * 2;
                scene.add(prop);
                mapObjects.push(prop);
            }
        }

        function setupSocket() {
            socket.on('initGame', (data) => {
                myId = data.id;
                myRole = data.players[myId].role;
                
                const roleEl = document.getElementById('role-display');
                if (myRole === 'hunter') {
                    roleEl.innerText = 'HUNTER (Loví čarodějnice)';
                    roleEl.className = 'font-bold text-amber-400';
                } else {
                    roleEl.innerText = 'WITCH (Čarodějnice - Maskuj se)';
                    roleEl.className = 'font-bold text-purple-400';
                }

                Object.keys(data.players).forEach(id => {
                    if (id !== myId) spawnOtherPlayer(data.players[id]);
                });
            });

            socket.on('newPlayer', (playerData) => spawnOtherPlayer(playerData));

            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].mesh.position.set(data.x, data.y, data.z);
                    otherPlayers[data.id].mesh.rotation.y = data.rotation;
                }
            });

            socket.on('propChanged', (data) => {
                if (otherPlayers[data.id]) {
                    scene.remove(otherPlayers[data.id].mesh);
                    const newMesh = createPropMesh(data.propType);
                    otherPlayers[data.id].mesh = newMesh;
                    scene.add(newMesh);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id].mesh);
                    delete otherPlayers[id];
                }
            });
        }

        function spawnOtherPlayer(data) {
            const mesh = createPropMesh(data.propType);
            mesh.position.set(data.x, data.y, data.z);
            scene.add(mesh);
            otherPlayers[data.id] = { mesh: mesh, role: data.role };
        }

        function onMouseMove(e) {
            if (!isLocked) return;
            yawObject.rotation.y -= e.movementX * 0.0025;
            pitchObject.rotation.x -= e.movementY * 0.0025;
            pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
        }

        function handleKey(code, isPressed) {
            if (code === 'KeyW') moveForward = isPressed;
            if (code === 'KeyS') moveBackward = isPressed;
            if (code === 'KeyA') moveLeft = isPressed;
            if (code === 'KeyD') moveRight = isPressed;
            if (code === 'ShiftLeft') isSprinting = isPressed;

            if (isPressed && code === 'KeyE' && myRole === 'witch') {
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(mapObjects.map(o => o.children[0]));

                if (intersects.length > 0 && intersects[0].distance < 7) {
                    const parentProp = intersects[0].object.parent;
                    const targetType = parentProp.userData.type;
                    socket.emit('changeProp', targetType);
                }
            }
        }

        function onMouseDown(e) {
            if (isLocked && e.button === 0 && myRole === 'hunter') {
                socket.emit('shoot', {
                    origin: yawObject.position,
                    dir: camera.getWorldDirection(new THREE.Vector3())
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isLocked) {
                const speed = isSprinting ? 10 : 6;
                const moveDist = speed * delta;

                if (moveForward) yawObject.translateZ(-moveDist);
                if (moveBackward) yawObject.translateZ(moveDist);
                if (moveLeft) yawObject.translateX(-moveDist);
                if (moveRight) yawObject.translateX(moveDist);

                socket.emit('playerMove', {
                    x: yawObject.position.x,
                    y: yawObject.position.y,
                    z: yawObject.position.z,
                    rotation: yawObject.rotation.y
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
