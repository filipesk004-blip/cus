<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>3D FPS Siege - Tactical Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0f1d; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 20; transition: opacity 0.1s;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }
        
        #hit-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 15;
            box-shadow: inset 0 0 100px rgba(239, 68, 68, 0);
            transition: box-shadow 0.1s ease-out;
        }
        #hit-vignette.active {
            box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.8);
        }

        #flashbang-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 40;
            background: white; opacity: 0;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body class="select-none" oncontextmenu="return false;">
    <div id="crosshair"></div>
    <div id="hit-vignette"></div>
    <div id="flashbang-overlay"></div>
    
    <!-- Horní nápověda -->
    <div class="fixed top-4 left-4 z-10 text-white pointer-events-none bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700/80 shadow-2xl">
        <h1 class="text-amber-400 font-black tracking-wider text-sm mb-1 uppercase">Siege 3D Tactical</h1>
        <div class="text-xs text-slate-300 space-y-0.5">
            <div>Pohyb: <span class="text-amber-400 font-bold">WASD</span> | Běh: <span class="text-amber-400 font-bold">Shift</span></div>
            <div>Skok: <span class="text-amber-400 font-bold">Space</span> | Skrčení: <span class="text-amber-400 font-bold">Ctrl / C</span></div>
            <div>Střelba: <span class="text-amber-400 font-bold">LMB</span> | Scope: <span class="text-amber-400 font-bold">RMB</span></div>
            <div>Flashbang: <span class="text-amber-400 font-bold">G</span> | Přebití: <span class="text-amber-400 font-bold">R</span></div>
        </div>
    </div>

    <!-- HUD vpravo dole -->
    <div class="fixed bottom-6 right-6 z-10 pointer-events-none flex items-center gap-4 bg-slate-900/90 backdrop-blur-md px-6 py-4 rounded-2xl border border-slate-700/80 shadow-2xl">
        <div class="flex flex-col items-end border-r border-slate-700 pr-4">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Zbraň</span>
            <span id="weapon-name" class="text-lg font-black text-amber-400 uppercase">Rifle</span>
        </div>

        <div class="flex flex-col items-end border-r border-slate-700 pr-4 w-24">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Stamina</span>
            <div class="w-full bg-slate-800 h-2 rounded-full mt-2 overflow-hidden border border-slate-700">
                <div id="stamina-bar" class="bg-amber-400 h-full w-full transition-all duration-75"></div>
            </div>
        </div>

        <div class="flex flex-col items-end border-r border-slate-700 pr-4">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Zdraví</span>
            <div class="flex items-baseline gap-1">
                <span id="hp" class="text-3xl font-black text-emerald-400">100</span>
                <span class="text-xs font-bold text-slate-500">/ 100</span>
            </div>
        </div>

        <div class="flex flex-col items-start pl-1 min-w-[70px]">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Munice</span>
            <div class="flex items-baseline gap-1">
                <span id="ammo" class="text-3xl font-black text-amber-400">30</span>
                <span class="text-xs font-bold text-slate-500">/ <span id="max-ammo">30</span></span>
            </div>
        </div>
    </div>

    <!-- Death Screen -->
    <div id="death-screen" class="hidden fixed inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md text-white">
        <h2 class="text-5xl font-black text-red-500 tracking-wider mb-2">BYL JSI ELIMINOVÁN</h2>
        <p class="text-slate-400 mb-6">Příště buď rychlejší na spoušti.</p>
        <button id="respawn-btn" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 font-bold text-slate-950 rounded-xl shadow-lg shadow-emerald-500/20 transition cursor-pointer transform hover:scale-105">
            ZNOVU DO AKCE
        </button>
    </div>

    <div id="game-container" class="w-full h-screen"></div>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false, isCrouching = false;
        let prevTime = performance.now();

        let yawObject, pitchObject;
        let myHp = 100;

        // Fyzika skoku a skrčení
        let yVelocity = 0;
        let isGrounded = true;
        const standingHeight = 1.6;
        const crouchingHeight = 0.9;
        let targetEyeHeight = standingHeight;

        const WEAPONS = {
            rifle: { name: 'Útočná Puška', maxAmmo: 30, damage: 25, fireRate: 150, zoomFov: 55, bodyPos: [0.2, -0.18, -0.4], aimPos: [0, -0.12, -0.3] },
            sniper: { name: 'Sniperka', maxAmmo: 5, damage: 50, fireRate: 800, zoomFov: 20, bodyPos: [0.2, -0.2, -0.45], aimPos: [0, -0.14, -0.3] }
        };

        let currentWeaponKey = 'rifle';
        let ammoState = { rifle: 30, sniper: 5 };
        let isReloading = false;
        let isAiming = false;
        let lastShotTime = 0;

        let stamina = 100;
        const maxStamina = 100;

        let otherPlayers = {};
        let obstacles = [];
        let bullets = [];
        let activeGrenades = [];
        let rifleGroup, sniperGroup, currentGunGroup, muzzleFlash;
        let flashTimer = 0;
        let isLocked = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);

            pitchObject = new THREE.Object3D();
            pitchObject.add(camera);

            yawObject = new THREE.Object3D();
            yawObject.position.y = standingHeight;
            yawObject.add(pitchObject);
            scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            createPlayerGuns();
            buildMap();
            setupSocketListeners();

            document.body.addEventListener('click', (e) => { 
                if (!isLocked && myHp > 0 && e.target.id !== 'respawn-btn') {
                    document.body.requestPointerLock();
                }
            });
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('wheel', onWheel);
            window.addEventListener('resize', onWindowResize);

            document.getElementById('respawn-btn').addEventListener('click', respawn);

            animate();
        }

        // Vytvoření procedurální mřížkové textury
        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 256, 256);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createPlayerGuns() {
            const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
            const magMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1 });

            rifleGroup = new THREE.Group();
            const rBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.45), darkMetal);
            const rBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.35), darkMetal);
            rBarrel.rotation.x = Math.PI / 2;
            rBarrel.position.set(0, 0.02, -0.35);
            const rMag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.08), magMat);
            rMag.position.set(0, -0.1, -0.05);
            rMag.rotation.x = 0.2;
            rifleGroup.add(rBody, rBarrel, rMag);

            sniperGroup = new THREE.Group();
            const sBody = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.14, 0.65), darkMetal);
            const sBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.55), darkMetal);
            sBarrel.rotation.x = Math.PI / 2;
            sBarrel.position.set(0, 0.03, -0.55);
            const sScope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.25), scopeMat);
            sScope.rotation.x = Math.PI / 2;
            sScope.position.set(0, 0.1, -0.1);
            const sMag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, 0.1), magMat);
            sMag.position.set(0, -0.11, -0.1);
            sniperGroup.add(sBody, sBarrel, sScope, sMag);

            const flashGeo = new THREE.ConeGeometry(0.06, 0.2, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.rotation.x = -Math.PI / 2;

            rifleGroup.position.set(...WEAPONS.rifle.bodyPos);
            sniperGroup.position.set(...WEAPONS.sniper.bodyPos);
            sniperGroup.visible = false;

            camera.add(rifleGroup, sniperGroup);
            currentGunGroup = rifleGroup;
            currentGunGroup.add(muzzleFlash);
            muzzleFlash.position.set(0, 0.02, -0.52);
        }

        function switchWeapon(key) {
            if (isReloading || currentWeaponKey === key) return;
            
            isAiming = false;
            camera.fov = 75;
            camera.updateProjectionMatrix();

            currentGunGroup.remove(muzzleFlash);
            rifleGroup.visible = false;
            sniperGroup.visible = false;

            currentWeaponKey = key;
            currentGunGroup = currentWeaponKey === 'rifle' ? rifleGroup : sniperGroup;
            currentGunGroup.visible = true;
            currentGunGroup.position.set(...WEAPONS[currentWeaponKey].bodyPos);
            
            currentGunGroup.add(muzzleFlash);
            muzzleFlash.position.set(0, 0.02, currentWeaponKey === 'rifle' ? -0.52 : -0.85);

            document.getElementById('weapon-name').innerText = WEAPONS[currentWeaponKey].name;
            document.getElementById('ammo').innerText = ammoState[currentWeaponKey];
            document.getElementById('max-ammo').innerText = WEAPONS[currentWeaponKey].maxAmmo;
        }

        function buildMap() {
            const gridTex = createGridTexture();
            gridTex.repeat.set(30, 30);
            
            const floorMat = new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.8 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallTex = createGridTexture();
            wallTex.repeat.set(10, 2);
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.6 });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7 });

            createObstacle(0, 2.5, -30, 60, 5, 1, wallMat);
            createObstacle(0, 2.5, 30, 60, 5, 1, wallMat);
            createObstacle(-30, 2.5, 0, 1, 5, 60, wallMat);
            createObstacle(30, 2.5, 0, 1, 5, 60, wallMat);

            createObstacle(-10, 1.25, -10, 4, 2.5, 4, crateMat);
            createObstacle(10, 1.25, -10, 4, 2.5, 4, crateMat);
            createObstacle(-10, 1.25, 10, 4, 2.5, 4, crateMat);
            createObstacle(10, 1.25, 10, 4, 2.5, 4, crateMat);
            
            createObstacle(0, 1.5, 0, 8, 3, 2, crateMat);
            createObstacle(-18, 1.5, 0, 2, 3, 12, crateMat);
            createObstacle(18, 1.5, 0, 2, 3, 12, crateMat);
        }

        function createObstacle(x, y, z, w, h, d, material) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            obstacles.push(new THREE.Box3().setFromObject(mesh));
        }

        function createEnemyMesh() {
            const group = new THREE.Group();
            const suitMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
            const vestMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.9, roughness: 0.1 });
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.35), suitMat);
            body.position.y = 0.85;

            const vest = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.55, 0.4), vestMat);
            vest.position.y = 0.9;

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), vestMat);
            head.position.y = 1.55;

            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.08, 0.05), visorMat);
            visor.position.set(0, 1.57, -0.16);

            const enemyGun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5), gunMat);
            enemyGun.position.set(0.18, 0.88, -0.35);

            group.add(body, vest, head, visor, enemyGun);
            scene.add(group);
            return group;
        }

        function setupSocketListeners() {
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id === socket.id) {
                        yawObject.position.x = players[id].x;
                        yawObject.position.z = players[id].z;
                    } else {
                        otherPlayers[id] = createEnemyMesh();
                        otherPlayers[id].position.set(players[id].x, 0, players[id].z);
                    }
                });
            });

            socket.on('newPlayer', (data) => {
                otherPlayers[data.id] = createEnemyMesh();
                otherPlayers[data.id].position.set(data.player.x, 0, data.player.z);
            });

            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].position.x = data.player.x;
                    otherPlayers[data.id].position.z = data.player.z;
                    otherPlayers[data.id].rotation.y = data.player.rotation;
                }
            });

            socket.on('playerShot', (data) => {
                if (data.hitPlayerId === socket.id && myHp > 0) {
                    myHp -= data.damage || 25;
                    document.getElementById('hp').innerText = Math.max(0, myHp);
                    
                    const vignette = document.getElementById('hit-vignette');
                    vignette.classList.add('active');
                    setTimeout(() => vignette.classList.remove('active'), 250);

                    if (myHp <= 0) {
                        document.exitPointerLock();
                        document.getElementById('death-screen').classList.remove('hidden');
                    }
                }
            });

            // Síťové vytvoření 3D granátu od ostatních hráčů
            socket.on('spawnFlashbang', (data) => {
                spawnVisualGrenade(data.pos, data.velocity, false);
            });

            // Výbuch Flashbangu a výpočet oslepení podle smyslového pohledu
            socket.on('flashbangDetonated', (data) => {
                const myPos = yawObject.position.clone();
                const flashPos = new THREE.Vector3(data.x, data.y, data.z);
                const dist = myPos.distanceTo(flashPos);

                if (dist < 22 && myHp > 0) {
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);

                    const dirToFlash = flashPos.clone().sub(myPos).normalize();
                    const dot = camDir.dot(dirToFlash); // 1 = přímý pohled, -1 = zcela zády

                    let intensity = 0;
                    if (dot > 0.2) {
                        intensity = (dist < 10) ? 1.0 : (1.0 - (dist - 10) / 12);
                    } else if (dot > -0.3) {
                        intensity = 0.3; // Částečný záblesk na periferii
                    } else {
                        intensity = 0.08; // Jen záblesk světla zpozadí
                    }

                    if (intensity > 0.05) {
                        const flashOverlay = document.getElementById('flashbang-overlay');
                        flashOverlay.style.opacity = intensity.toString();
                        
                        const duration = Math.max(1000, 4500 * intensity);
                        setTimeout(() => {
                            flashOverlay.style.transition = `opacity ${duration / 1000}s ease-out`;
                            flashOverlay.style.opacity = '0';
                            setTimeout(() => flashOverlay.style.transition = 'opacity 0.1s ease-out', duration);
                        }, 200);
                    }
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });
        }

        function createBulletTrace(startPos, dirVector) {
            const tracerMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const tracerGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.8);
            const tracer = new THREE.Mesh(tracerGeo, tracerMat);

            tracer.position.copy(startPos);
            
            const targetPos = startPos.clone().add(dirVector);
            tracer.lookAt(targetPos);
            tracer.rotateX(Math.PI / 2);

            scene.add(tracer);

            bullets.push({
                mesh: tracer,
                dir: dirVector.clone().normalize(),
                distanceTraveled: 0,
                maxDistance: 60
            });
        }

        function spawnVisualGrenade(pos, velocity, isMaster) {
            const gGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.15, 8);
            const gMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.5 });
            const mesh = new THREE.Mesh(gGeo, gMat);
            mesh.position.copy(pos);
            scene.add(mesh);

            activeGrenades.push({
                mesh: mesh,
                velocity: new THREE.Vector3(velocity.x, velocity.y, velocity.z),
                timer: 2.2, // Časovač výbuchu v sekundách
                isMaster: isMaster
            });
        }

        function throwFlashbang() {
            if (!isLocked || myHp <= 0) return;

            const startPos = new THREE.Vector3();
            camera.getWorldPosition(startPos);
            
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            startPos.add(dir.clone().multiplyScalar(0.5));
            const velocity = dir.multiplyScalar(14);
            velocity.y += 3; // Mírný oblouk nahoru

            spawnVisualGrenade(startPos, velocity, true);

            socket.emit('throwFlashbang', {
                pos: { x: startPos.x, y: startPos.y, z: startPos.z },
                velocity: { x: velocity.x, y: velocity.y, z: velocity.z }
            });
        }

        function reload() {
            const w = WEAPONS[currentWeaponKey];
            if (isReloading || ammoState[currentWeaponKey] === w.maxAmmo) return;
            isReloading = true;
            
            let startRot = currentGunGroup.rotation.x;
            currentGunGroup.rotation.x = -0.8;
            document.getElementById('ammo').innerText = "RELOAD";

            setTimeout(() => {
                ammoState[currentWeaponKey] = w.maxAmmo;
                document.getElementById('ammo').innerText = w.maxAmmo;
                currentGunGroup.rotation.x = startRot;
                isReloading = false;
            }, 1200);
        }

        function respawn() {
            myHp = 100;
            ammoState = { rifle: WEAPONS.rifle.maxAmmo, sniper: WEAPONS.sniper.maxAmmo };
            stamina = maxStamina;
            document.getElementById('hp').innerText = myHp;
            document.getElementById('ammo').innerText = ammoState[currentWeaponKey];
            document.getElementById('stamina-bar').style.width = '100%';
            document.getElementById('death-screen').classList.add('hidden');
            
            yawObject.position.x = (Math.random() - 0.5) * 20;
            yawObject.position.z = (Math.random() - 0.5) * 20;

            document.body.requestPointerLock();
        }

        function handleKey(code, state) {
            if (code === 'KeyW') moveForward = state;
            if (code === 'KeyS') moveBackward = state;
            if (code === 'KeyA') moveLeft = state;
            if (code === 'KeyD') moveRight = state;
            if (code === 'ShiftLeft' || code === 'ShiftRight') isSprinting = state;
            if (code === 'ControlLeft' || code === 'KeyC') isCrouching = state;
            
            if (code === 'Space' && state && isGrounded && !isCrouching) {
                yVelocity = 6.0;
                isGrounded = false;
            }

            if (code === 'KeyR' && state) reload();
            if (code === 'KeyG' && state) throwFlashbang();
            if (code === 'Digit1' && state) switchWeapon('rifle');
            if (code === 'Digit2' && state) switchWeapon('sniper');
        }

        function onMouseDown(e) {
            if (!isLocked || myHp <= 0) return;
            if (e.button === 0) shoot();
            if (e.button === 2) isAiming = true;
        }

        function onMouseUp(e) {
            if (e.button === 2) isAiming = false;
        }

        function onWheel(e) {
            if (!isLocked || myHp <= 0) return;
            if (e.deltaY > 0) switchWeapon('sniper');
            else if (e.deltaY < 0) switchWeapon('rifle');
        }

        function onMouseMove(e) {
            if (!isLocked || myHp <= 0) return;

            const movementX = e.movementX || 0;
            const movementY = e.movementY || 0;
            const sens = isAiming ? 0.001 : 0.002;

            yawObject.rotation.y -= movementX * sens;
            pitchObject.rotation.x -= movementY * sens;
            pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
        }

        function checkCollision(newPosition) {
            const playerRadius = 0.5;
            const currentH = isCrouching ? crouchingHeight : standingHeight;
            const playerBox = new THREE.Box3(
                new THREE.Vector3(newPosition.x - playerRadius, newPosition.y - currentH, newPosition.z - playerRadius),
                new THREE.Vector3(newPosition.x + playerRadius, newPosition.y, newPosition.z + playerRadius)
            );

            for (let i = 0; i < obstacles.length; i++) {
                if (playerBox.intersectsBox(obstacles[i])) return true;
            }
            return false;
        }

        function shoot() {
            const now = performance.now();
            const w = WEAPONS[currentWeaponKey];

            if (now - lastShotTime < w.fireRate) return;
            if (isReloading) return;

            if (ammoState[currentWeaponKey] <= 0) {
                reload();
                return;
            }

            lastShotTime = now;
            ammoState[currentWeaponKey]--;
            document.getElementById('ammo').innerText = ammoState[currentWeaponKey];

            muzzleFlash.material.opacity = 1;
            flashTimer = 0.05;

            const gunWorldPos = new THREE.Vector3();
            muzzleFlash.getWorldPosition(gunWorldPos);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            createBulletTrace(gunWorldPos, raycaster.ray.direction);

            Object.keys(otherPlayers).forEach((id) => {
                const hits = raycaster.intersectObjects(otherPlayers[id].children);
                if (hits.length > 0) {
                    socket.emit('shoot', { hitPlayerId: id, damage: w.damage });
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (flashTimer > 0) {
                flashTimer -= delta;
                if (flashTimer <= 0) muzzleFlash.material.opacity = 0;
            }

            // Pohyb projektilů
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const moveStep = 90 * delta;
                b.mesh.position.addScaledVector(b.dir, moveStep);
                b.distanceTraveled += moveStep;

                if (b.distanceTraveled >= b.maxDistance) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Pohyb a fyzika 3D Flashbangů
            for (let i = activeGrenades.length - 1; i >= 0; i--) {
                const g = activeGrenades[i];
                g.timer -= delta;
                
                // Gravitace a posun
                g.velocity.y -= 15.0 * delta;
                g.mesh.position.addScaledVector(g.velocity, delta);
                g.mesh.rotation.x += 5 * delta;
                g.mesh.rotation.z += 5 * delta;

                // Odraz od podlahy
                if (g.mesh.position.y <= 0.08) {
                    g.mesh.position.y = 0.08;
                    g.velocity.y *= -0.4;
                    g.velocity.x *= 0.6;
                    g.velocity.z *= 0.6;
                }

                if (g.timer <= 0) {
                    if (g.isMaster) {
                        socket.emit('flashbangExploded', {
                            x: g.mesh.position.x,
                            y: g.mesh.position.y,
                            z: g.mesh.position.z
                        });
                    }
                    scene.remove(g.mesh);
                    activeGrenades.splice(i, 1);
                }
            }

            // Výška kamery (skrčení)
            targetEyeHeight = isCrouching ? crouchingHeight : standingHeight;

            // Vertikální pohyb (skákání a gravitace)
            if (!isGrounded) {
                yawObject.position.y += yVelocity * delta;
                yVelocity -= 18.0 * delta;

                if (yawObject.position.y <= targetEyeHeight) {
                    yawObject.position.y = targetEyeHeight;
                    yVelocity = 0;
                    isGrounded = true;
                }
            } else {
                yawObject.position.y += (targetEyeHeight - yawObject.position.y) * 0.2;
            }

            // Zoom kamery a offset zbraně
            const targetFov = isAiming ? WEAPONS[currentWeaponKey].zoomFov : 75;
            const targetPos = isAiming ? WEAPONS[currentWeaponKey].aimPos : WEAPONS[currentWeaponKey].bodyPos;

            camera.fov += (targetFov - camera.fov) * 0.15;
            camera.updateProjectionMatrix();

            currentGunGroup.position.x += (targetPos[0] - currentGunGroup.position.x) * 0.2;
            currentGunGroup.position.y += (targetPos[1] - currentGunGroup.position.y) * 0.2;
            currentGunGroup.position.z += (targetPos[2] - currentGunGroup.position.z) * 0.2;

            if (isLocked && myHp > 0) {
                const isMoving = moveForward || moveBackward || moveLeft || moveRight;
                let speedMultiplier = isAiming ? 3.0 : 5.0;

                if (isCrouching) {
                    speedMultiplier = 2.2;
                } else if (isSprinting && isMoving && stamina > 0 && !isAiming) {
                    speedMultiplier = 9.0;
                    stamina = Math.max(0, stamina - delta * 35);
                }

                if (!isSprinting && stamina < maxStamina) {
                    stamina = Math.min(maxStamina, stamina + delta * 20);
                }

                document.getElementById('stamina-bar').style.width = `${(stamina / maxStamina) * 100}%`;

                const moveDistance = speedMultiplier * delta;
                const oldPos = yawObject.position.clone();

                if (moveForward) yawObject.translateZ(-moveDistance);
                if (moveBackward) yawObject.translateZ(moveDistance);
                if (moveLeft) yawObject.translateX(-moveDistance);
                if (moveRight) yawObject.translateX(moveDistance);

                if (checkCollision(yawObject.position)) {
                    yawObject.position.copy(oldPos);
                }

                socket.emit('playerMove', {
                    x: yawObject.position.x,
                    z: yawObject.position.z,
                    rotation: yawObject.rotation.y
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
