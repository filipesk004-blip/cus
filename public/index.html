<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Witch Hunt 3D - Prop Hunt Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #090d16; font-family: 'Segoe UI', sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fbbf24; }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }
        
        #hitmark {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 25;
            opacity: 0; transition: opacity 0.05s ease-out;
        }
        #hitmark::before, #hitmark::after { content: ''; position: absolute; background: #a855f7; }
        #hitmark::before { top: 9px; left: -4px; width: 28px; height: 2px; }
        #hitmark::after { top: -4px; left: 9px; width: 2px; height: 28px; }
    </style>
</head>
<body class="select-none" oncontextmenu="return false;">

    <div id="crosshair"></div>
    <div id="hitmark"></div>

    <!-- HUD Overlay -->
    <div class="fixed top-4 left-4 z-10 text-white pointer-events-none bg-slate-900/80 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-2xl">
        <h1 class="text-amber-400 font-black tracking-wider text-sm mb-1 uppercase">Witch Hunt 3D</h1>
        <div class="text-xs text-slate-300 space-y-0.5">
            <div>Pohyb: <span class="text-amber-400 font-bold">WASD</span> | Běh: <span class="text-amber-400 font-bold">Shift</span></div>
            <div>Lovit (Magie): <span class="text-amber-400 font-bold">LMB</span></div>
            <div>Cíl: Najdi a znič všechny schované čarodějnice!</div>
        </div>
    </div>

    <div class="fixed top-4 right-4 z-10 pointer-events-none flex flex-col items-end gap-2">
        <div class="bg-slate-900/80 backdrop-blur-md px-5 py-3 rounded-xl border border-slate-700 shadow-2xl flex items-center gap-4">
            <div>
                <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400 block">Zbývá Čarodějnic</span>
                <span id="witches-left" class="text-2xl font-black text-purple-400">5 / 5</span>
            </div>
            <div class="border-l border-slate-700 pl-4">
                <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400 block">Skóre</span>
                <span id="score" class="text-2xl font-black text-amber-400">0</span>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md text-white">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 shadow-2xl flex flex-col items-center max-w-md text-center">
            <h1 class="text-3xl font-black text-amber-400 mb-2 uppercase tracking-widest">Witch Hunt</h1>
            <p class="text-slate-300 text-sm mb-6">
                Čarodějnice se proměnily v předměty v lese (sudy, bedny, kámeny)! Střílej po podezřelých objektech a najdi je všechny před vypršením času.
            </p>
            <button id="start-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 font-bold text-slate-950 rounded-xl shadow-lg transition cursor-pointer">
                ZAČÍT LOV
            </button>
        </div>
    </div>

    <div id="game-container" class="w-full h-screen"></div>

    <script>
        let scene, camera, renderer;
        let yawObject, pitchObject;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let prevTime = performance.now();
        let isLocked = false;

        let props = [];
        let witchesLeft = 5;
        let score = 0;
        let spellProjectiles = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);
            scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            pitchObject = new THREE.Object3D();
            pitchObject.add(camera);

            yawObject = new THREE.Object3D();
            yawObject.position.set(0, 1.6, 0);
            yawObject.add(pitchObject);
            scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Svetla
            const ambient = new THREE.AmbientLight(0xd8b4fe, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xfef08a, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            buildMap();
            spawnPropsAndWitches();

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#0f172a';
            for(let i=0; i<100; i++) ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
            return new THREE.CanvasTexture(canvas);
        }

        function buildMap() {
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
        }

        function spawnPropsAndWitches() {
            const propTypes = ['box', 'barrel', 'rock'];
            const totalObjects = 35;
            let witchIndices = new Set();

            while(witchIndices.size < witchesLeft) {
                witchIndices.add(Math.floor(Math.random() * totalObjects));
            }

            for (let i = 0; i < totalObjects; i++) {
                const type = propTypes[Math.floor(Math.random() * propTypes.length)];
                const isWitch = witchIndices.has(i);
                
                let mesh;
                if (type === 'box') {
                    mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.6 })
                    );
                } else if (type === 'barrel') {
                    mesh = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.5, 0.5, 1.2, 12),
                        new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.5 })
                    );
                } else {
                    mesh = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.7),
                        new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 })
                    );
                }

                const x = (Math.random() - 0.5) * 60;
                const z = (Math.random() - 0.5) * 60;
                mesh.position.set(x, 0.5, z);
                scene.add(mesh);

                props.push({
                    mesh: mesh,
                    isWitch: isWitch,
                    hp: isWitch ? 2 : 1
                });
            }
        }

        function shootMagic() {
            const spellGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const spellMat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });
            const spell = new THREE.Mesh(spellGeo, spellMat);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            spell.position.copy(yawObject.position);
            spell.position.y += 0.2;
            
            scene.add(spell);
            spellProjectiles.push({ mesh: spell, dir: dir, life: 0 });

            // Raycast detekce zásahu
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(props.map(p => p.mesh));

            if (intersects.length > 0 && intersects[0].distance < 25) {
                const hitObj = intersects[0].object;
                const propIndex = props.findIndex(p => p.mesh === hitObj);

                if (propIndex !== -1) {
                    const prop = props[propIndex];
                    
                    // Hitmark efektivita
                    const hitmark = document.getElementById('hitmark');
                    hitmark.style.opacity = '1';
                    setTimeout(() => hitmark.style.opacity = '0', 100);

                    if (prop.isWitch) {
                        // Zásah Čarodějnice!
                        score += 100;
                        witchesLeft--;
                        document.getElementById('score').innerText = score;
                        document.getElementById('witches-left').innerText = `${witchesLeft} / 5`;

                        // Efekt odhalení
                        createParticles(prop.mesh.position, 0xa855f7);
                        scene.remove(prop.mesh);
                        props.splice(propIndex, 1);

                        if (witchesLeft === 0) {
                            setTimeout(() => alert("VYHRÁL JSI! Najít všechny čarodějnice trvalo chvilku."), 100);
                        }
                    } else {
                        // Zásah obyčejného objektu
                        createParticles(prop.mesh.position, 0x64748b);
                    }
                }
            }
        }

        function createParticles(pos, color) {
            for(let i=0; i<10; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.1),
                    new THREE.MeshBasicMaterial({ color: color })
                );
                p.position.copy(pos);
                scene.add(p);
                setTimeout(() => scene.remove(p), 400);
            }
        }

        function onMouseMove(e) {
            if (!isLocked) return;
            yawObject.rotation.y -= e.movementX * 0.0025;
            pitchObject.rotation.x -= e.movementY * 0.0025;
            pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
        }

        function handleKey(code, isPressed) {
            if (code === 'KeyW') moveForward = isPressed;
            if (code === 'KeyS') moveBackward = isPressed;
            if (code === 'KeyA') moveLeft = isPressed;
            if (code === 'KeyD') moveRight = isPressed;
            if (code === 'ShiftLeft') isSprinting = isPressed;
        }

        function onMouseDown(e) {
            if (isLocked && e.button === 0) shootMagic();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isLocked) {
                const speed = isSprinting ? 12 : 6;
                const moveDist = speed * delta;

                if (moveForward) yawObject.translateZ(-moveDist);
                if (moveBackward) yawObject.translateZ(moveDist);
                if (moveLeft) yawObject.translateX(-moveDist);
                if (moveRight) yawObject.translateX(moveDist);
            }

            // Animace kouzel
            for(let i = spellProjectiles.length - 1; i >= 0; i--) {
                const sp = spellProjectiles[i];
                sp.mesh.position.addScaledVector(sp.dir, 30 * delta);
                sp.life += delta;
                if(sp.life > 0.5) {
                    scene.remove(sp.mesh);
                    spellProjectiles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').remove();
            document.body.requestPointerLock();
            init();
        });
    </script>
</body>
</html>
