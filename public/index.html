<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>3D Multiplayer FPS Siege</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }
    </style>
</head>
<body class="select-none">
    <div id="crosshair"></div>
    
    <div class="fixed top-4 left-4 z-10 text-white space-y-1 pointer-events-none bg-black/80 p-4 rounded-lg border border-slate-700">
        <h1 class="text-amber-400 font-bold text-sm mb-1">SIEGE 3D - MULTIPLAYER PvP</h1>
        <div>KLIKNI PRO AKTIVACI MYŠI</div>
        <div>Pohyb: <span class="text-amber-300">WASD</span> | Střelba: <span class="text-amber-300">LMB</span></div>
        <div class="pt-2 text-xs">Tvoje HP: <span id="hp" class="text-emerald-400 font-bold">100</span></div>
    </div>

    <div id="game-container" class="w-full h-screen"></div>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let myHp = 100;
        let otherPlayers = {};
        let gunGroup, muzzleFlash;
        let flashTimer = 0;
        let isLocked = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const pointLight = new THREE.PointLight(0xffaa44, 1.2, 35);
            pointLight.position.set(0, 6, 0);
            scene.add(pointLight);

            createPlayerGun();
            buildMap();
            setupSocketListeners();

            document.body.addEventListener('click', () => { if (!isLocked && myHp > 0) document.body.requestPointerLock(); });
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousedown', shoot);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createPlayerGun() {
            gunGroup = new THREE.Group();
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });

            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.5), gunMat);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), gunMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.02, -0.4);

            gunGroup.add(gunBody, barrel);

            const flashGeo = new THREE.ConeGeometry(0.08, 0.25, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.rotation.x = -Math.PI / 2;
            muzzleFlash.position.set(0, 0.02, -0.6);
            gunGroup.add(muzzleFlash);

            gunGroup.position.set(0.25, -0.22, -0.5);
            
            // Připojení zbraně přímo ke kameře
            camera.add(gunGroup);
            scene.add(camera);
        }

        function buildMap() {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            createWall(0, 2.5, -25, 50, 5, 1, wallMat);
            createWall(0, 2.5, 25, 50, 5, 1, wallMat);
            createWall(-25, 2.5, 0, 1, 5, 50, wallMat);
            createWall(25, 2.5, 0, 1, 5, 50, wallMat);
            
            createWall(-10, 2.5, 0, 1, 5, 15, wallMat);
            createWall(10, 2.5, 0, 1, 5, 15, wallMat);
        }

        function createWall(x, y, z, w, h, d, material) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            wall.position.set(x, y, z);
            scene.add(wall);
        }

        function createEnemyMesh() {
            const group = new THREE.Group();
            const armorMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const vestMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.4), armorMat);
            body.position.y = 0.9;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), vestMat);
            head.position.y = 1.7;
            const enemyGun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), vestMat);
            enemyGun.position.set(-0.3, 1.0, 0.3);

            group.add(body, head, enemyGun);
            scene.add(group);
            return group;
        }

        function setupSocketListeners() {
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id === socket.id) {
                        camera.position.set(players[id].x, 1.6, players[id].z);
                        camera.rotation.y = players[id].rotation;
                    } else {
                        otherPlayers[id] = createEnemyMesh();
                        otherPlayers[id].position.set(players[id].x, 0, players[id].z);
                    }
                });
            });

            socket.on('newPlayer', (data) => {
                otherPlayers[data.id] = createEnemyMesh();
                otherPlayers[data.id].position.set(data.player.x, 0, data.player.z);
            });

            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].position.x = data.player.x;
                    otherPlayers[data.id].position.z = data.player.z;
                    otherPlayers[data.id].rotation.y = data.player.rotation;
                }
            });

            socket.on('playerShot', (data) => {
                if (data.hitPlayerId === socket.id && myHp > 0) {
                    myHp -= 25;
                    document.getElementById('hp').innerText = Math.max(0, myHp);
                    if (myHp <= 0) {
                        alert("BYL JSI ZABIT PROTIHRÁČEM!");
                        document.exitPointerLock();
                    }
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });
        }

        function handleKey(code, state) {
            if (code === 'KeyW') moveForward = state;
            if (code === 'KeyS') moveBackward = state;
            if (code === 'KeyA') moveLeft = state;
            if (code === 'KeyD') moveRight = state;
        }

        function onMouseMove(e) {
            if (!isLocked || myHp <= 0) return;
            camera.rotation.y -= e.movementX * 0.002;
            const pitch = camera.rotation.x - e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
            camera.rotation.z = 0;
        }

        function shoot() {
            if (!isLocked || myHp <= 0) return;

            muzzleFlash.material.opacity = 1;
            flashTimer = 0.05;
            gunGroup.position.z = -0.4;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            Object.keys(otherPlayers).forEach((id) => {
                const hits = raycaster.intersectObjects(otherPlayers[id].children);
                if (hits.length > 0) {
                    socket.emit('shoot', { hitPlayerId: id });
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (flashTimer > 0) {
                flashTimer -= delta;
                if (flashTimer <= 0) muzzleFlash.material.opacity = 0;
            }
            gunGroup.position.z += (-0.5 - gunGroup.position.z) * 0.2;

            if (isLocked && myHp > 0) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 1.6;

                socket.emit('playerMove', {
                    x: camera.position.x,
                    z: camera.position.z,
                    rotation: camera.rotation.y
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
